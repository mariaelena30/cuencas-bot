name: Actualizar precipitacion

on:
  schedule:
    # Corre todos los dias a las 10:00 UTC (07:00 hora Chaco)
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el actualizador de precipitacion
        run: python actualizar_precipitacion.py

