name: Actualizar niveles de rio

on:
  schedule:
    # Corre todos los dias a las 09:00 y 21:00 UTC (06:00 y 18:00 hora Chaco)
    - cron: "0 9,21 * * *"
  workflow_dispatch: {}  # permite tambien correrlo a mano desde la pestaña "Actions" en GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 lxml
        
- name: Correr el actualizador de niveles
  run: python path/to/actualizar_niveles.py
