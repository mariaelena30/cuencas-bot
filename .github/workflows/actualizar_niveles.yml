# Guardar como: .github/workflows/actualizar_niveles.yml
# (dentro del repo cuencas-bot)
#
# Esto agrega un BOTON en GitHub para correr actualizar_niveles.py
# sin necesidad de terminal ni Python instalado en tu computadora.
name: Actualizar niveles de rios

on:
  workflow_dispatch: {}     # habilita el boton "Run workflow" en GitHub
  schedule:
    - cron: "*/15 * * * *"  # ademas, corre solo cada 15 minutos

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr actualizar_niveles.py
        run: python actualizar_niveles.py