name: Actualizar precipitacion

on:
  schedule:
    # Cada 3 horas, para que la "lluvia de las ultimas 24 h" sea reciente
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr el actualizador de precipitacion
        run: python actualizar_precipitacion.py
        env:
          API_KEY_SENSORES: ${{ secrets.API_KEY_SENSORES }}
