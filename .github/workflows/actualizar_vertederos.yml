name: Actualizar estado de vertederos (Itaipú/Yacyretá)

on:
  schedule:
    # Cada 6 horas — misma cadencia que actualizar_niveles.py
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions, util para probar hoy

permissions:
  contents: write

jobs:
  actualizar-vertederos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr script
        run: python actualizar_vertederos.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vertederos_estado.json
          git diff --quiet --cached || git commit -m "Actualizar estado de vertederos [automatico]"
          git push
